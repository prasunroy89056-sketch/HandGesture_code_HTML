<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Hand Controlled Flower</title>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 1;
            background: #111;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #flower {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            pointer-events: none;
            user-select: none;
            transition: left 0.05s linear, top 0.05s linear;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.65);
            padding: 15px 20px;
            border-radius: 12px;
            z-index: 10;
        }

        #info h2 {
            margin: 0 0 8px;
        }
    </style>
</head>

<body>

<div id="container">

    <video id="video" autoplay playsinline></video>

    <canvas id="canvas"></canvas>

    <div id="flower">🌸</div>

    <div id="info">
        <h2>🌸 AI Flower Control</h2>
        <div>☝️ Move your index finger</div>
        <div>🌸 The flower follows your fingertip</div>
    </div>

</div>


<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const flower = document.getElementById("flower");


// Create AI hand detector
const hands = new Hands({
    locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }
});


// Detection settings
hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.7
});


// When hand is detected
hands.onResults(results => {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Check if a hand exists
    if (results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0) {

        const landmarks =
            results.multiHandLandmarks[0];


        // Draw hand skeleton
        drawConnectors(
            ctx,
            landmarks,
            HAND_CONNECTIONS,
            {
                color: "#00ff00",
                lineWidth: 3
            }
        );


        // Draw hand points
        drawLandmarks(
            ctx,
            landmarks,
            {
                color: "#ff0000",
                lineWidth: 2
            }
        );


        /*
            MediaPipe landmark 8
            = Index finger tip
        */

        const indexFinger = landmarks[8];


        // Convert AI coordinates to screen coordinates

        const x =
            (1 - indexFinger.x) * window.innerWidth;

        const y =
            indexFinger.y * window.innerHeight;


        // Move flower
        flower.style.left = x + "px";
        flower.style.top = y + "px";

    }

});


// Start webcam
const camera = new Camera(video, {

    onFrame: async () => {

        await hands.send({
            image: video
        });

    },

    width: 1280,
    height: 720

});


// Start camera
camera.start();

</script>

</body>
</html>
